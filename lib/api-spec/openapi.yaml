openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: party
    description: Party and combat session operations
  - name: ai
    description: AI parsing and generation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /party/create:
    post:
      operationId: createParty
      tags: [party]
      summary: Create a party
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Party created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /party/join/{code}:
    post:
      operationId: joinParty
      tags: [party]
      summary: Join a party by code
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Party joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /party/{code}/register-member:
    post:
      operationId: registerPartyMember
      tags: [party]
      summary: Enroll a new member with a server-issued identity and private capability
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      responses:
        "200":
          description: New identity and private token, returned once with Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [code, memberId, memberToken]
                properties:
                  code:
                    type: string
                  memberId:
                    type: string
                    format: uuid
                  memberToken:
                    type: string
                    description: Private bearer capability, never share with the party code
        "404":
          description: Party missing or expired
  /party/leave:
    delete:
      operationId: leaveParty
      tags: [party]
      summary: Remove a member with their own capability or the original host capability
      description: Membership removal and durable runtime cleanup commit together. Server-bound companions retain live data with companionAdmission.detachedAt and leave encounter order. Rejoining never rebinds retained instances. Host retries after successful removal are no-ops; removed member proof is revoked.
      security:
        - partyCapability: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId, partyCode]
              properties:
                memberId:
                  type: string
                partyCode:
                  type: string
      responses:
        "200":
          description: Member removed
        "403":
          description: Missing or incorrect member or host capability
        "409":
          description: Runtime revision or transaction serialization conflict; no departure committed
        "500":
          description: Departure failed; no success acknowledgement
  /party/{code}/disband:
    post:
      operationId: disbandParty
      tags: [party]
      summary: Disband using the original host capability
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      responses:
        "200":
          description: Party disbanded
        "403":
          description: Missing or incorrect original host capability
  /party/sync:
    put:
      operationId: syncPartyMemberState
      tags: [party]
      summary: Sync an existing member using that member's private capability
      security:
        - partyCapability: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Sync accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "403":
          description: Missing, revoked or incorrect member capability
        "409":
          description: Sync conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /party/{code}/members:
    get:
      operationId: getPartyMembers
      tags: [party]
      summary: Get party members
      description: Requires original-host bearer proof or a live member bearer capability paired with X-Party-Member-Id. Party invitation code alone is not sufficient.
      security:
        - partyCapability: []
      parameters:
        - name: X-Party-Member-Id
          in: header
          required: false
          description: Required with member bearer proof; omitted for host proof.
          schema:
            type: string
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      responses:
        "200":
          description: Party member list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /party/{code}/note-assignments:
    post:
      operationId: createPartyNoteAssignments
      tags: [party]
      summary: Send DM notes using the original host capability
      description: Requires the original host proof before activity or runtime changes. Caller assignedBy/DM flags do not grant authority; assignments are stamped as DM-originated. Legacy unclaimed parties cannot send notes. Recipient accept/decline authorization is enforced separately. Payload supports optional journal notes plus quests, people and locations; quest status is preserved.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Notes assigned by authenticated host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          description: Invalid targets or empty note payload
        "403":
          description: Missing or incorrect original host capability
        "404":
          description: Party absent or expired
  /party/{code}/note-assignments/{assignmentId}/accept:
    put:
      operationId: acceptPartyNoteAssignment
      tags: [party]
      summary: Accept a note assignment using its recipient's member proof
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Recipient operation accepted
        "400":
          description: Missing member ID
        "403":
          description: Missing member proof or assignment belongs to another recipient
        "404":
          description: Party or assignment absent, or session expired
        "409":
          description: Assignment transition or runtime revision conflict
  /party/{code}/note-assignments/{assignmentId}/decline:
    put:
      operationId: declinePartyNoteAssignment
      tags: [party]
      summary: Decline a note assignment using its recipient's member proof
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Recipient operation accepted
        "400":
          description: Missing member ID
        "403":
          description: Missing member proof or assignment belongs to another recipient
        "404":
          description: Party or assignment absent, or session expired
        "409":
          description: Assignment transition or runtime revision conflict
  /party/{code}/initiative/start:
    post:
      operationId: startPartyInitiative
      tags: [party]
      summary: Start initiative as the original party host
      description: Requires original-host bearer proof before session or runtime side effects. Member IDs, DM flags and AI DM labels do not authorize this operation. AI DM clients use the same host capability.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Encounter control applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "403":
          description: Missing or invalid host capability (party_host_required)
        "404":
          description: Party expired or not found, or referenced encounter not found where required
        "400":
          description: No valid combat participants
  /party/{code}/encounters/{battleId}:
    delete:
      operationId: endPartyEncounter
      tags: [party]
      summary: End an encounter as the original party host
      description: Requires original-host bearer proof before session or runtime side effects. Member IDs, DM flags and AI DM labels do not authorize this operation. AI DM clients use the same host capability.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
        - name: battleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Encounter control applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "403":
          description: Missing or invalid host capability (party_host_required)
        "404":
          description: Party expired or not found, or referenced encounter not found where required
  /party/{code}/encounters/{battleId}/participants:
    post:
      operationId: addPartyEncounterParticipants
      tags: [party]
      summary: Add encounter participants as the original party host
      description: Requires original-host bearer proof before session or runtime side effects. Member IDs, DM flags and AI DM labels do not authorize this operation. AI DM clients use the same host capability.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
        - name: battleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Encounter control applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "403":
          description: Missing or invalid host capability (party_host_required)
        "404":
          description: Party expired or not found, or referenced encounter not found where required
        "400":
          description: No valid combat participants
  /party/{code}/initiative/roll:
    put:
      operationId: submitInitiativeRoll
      tags: [party]
      summary: Apply member-owned action using live member proof
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Action accepted
        "400":
          description: Missing member or invalid action
        "403":
          description: Missing member proof or target mismatch
        "404":
          description: Party or referenced object absent
        "409":
          description: State transition or revision conflict
  /party/{code}/loot-assignments/{assignmentId}/claim:
    put:
      operationId: claimPartyLootAssignment
      tags: [party]
      summary: Apply member-owned action using live member proof
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Action accepted
        "400":
          description: Missing member or invalid action
        "403":
          description: Missing member proof or target mismatch
        "404":
          description: Party or referenced object absent
        "409":
          description: State transition or revision conflict
  /party/{code}/combat-state:
    get:
      operationId: getPartyCombatState
      tags: [party]
      summary: Get current combat state
      description: Requires original-host bearer proof or a live member bearer capability paired with X-Party-Member-Id. Party invitation code alone is not sufficient.
      security:
        - partyCapability: []
      parameters:
        - name: X-Party-Member-Id
          in: header
          required: false
          description: Required with member bearer proof; omitted for host proof.
          schema:
            type: string
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      responses:
        "200":
          description: Combat state payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /party/{code}/end-turn:
    post:
      operationId: endPartyTurn
      tags: [party]
      summary: Advance own battle turn or host override
      description: Live current member in own battle, or original host. Body DM flags are not authority.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Action accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          description: Missing or invalid action input
        "403":
          description: Missing live caller proof or caller not permitted
        "404":
          description: Party not found
        "409":
          description: Runtime revision conflict
  /party/{code}/economy/spend:
    post:
      operationId: spendPlayerEconomy
      tags: [party]
      summary: Spend own member economy
      description: Exact live member bearer required. Out-of-turn reactions remain supported; client limits are not proof of fair combat.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Action accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          description: Missing or invalid action input
        "403":
          description: Missing live caller proof or caller not permitted
        "404":
          description: Party not found
        "409":
          description: Runtime revision conflict
  /party/{code}/economy/reset:
    post:
      operationId: resetPlayerEconomy
      tags: [party]
      summary: Manually reset own member economy
      description: Exact live member bearer required. Preserves existing self-reset semantics; does not prove reset eligibility.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Action accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          description: Missing or invalid action input
        "403":
          description: Missing live caller proof or caller not permitted
        "404":
          description: Party not found
        "409":
          description: Runtime revision conflict
  /party/{code}/loot-assignments:
    post:
      operationId: createPartyLootAssignments
      tags: [party]
      summary: Author a host award or member transfer
      description: Original host proof stamps dm origin. Member proof must match assignedBy sender. Inventory ownership, debit and delivery atomicity remain separate.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Action accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          description: Missing or invalid action input
        "403":
          description: Missing live caller proof or caller not permitted
        "404":
          description: Party not found
        "409":
          description: Runtime revision conflict
  /party/{code}/combat-npcs:
    post:
      operationId: addCombatNpc
      tags: [party]
      summary: Create a host NPC or admit a member companion projection
      description: Ordinary creation requires original-host proof. Companion metadata requires exact live ownerMemberId bearer proof, constrained friendly character fields and own-member battle scope. Proof authenticates the submitter, not saved companion ownership or stats. Host proof cannot substitute for member proof on companion admission. Player-managed admission stamps server provenance and reuses an existing committed live instance without resetting it; companion responses include reused. Companion creation and reuse revalidate locked session/member proof in a serializable transaction with durable runtime reads, activity refresh and revision-guarded save. Responses follow commit. Serialization and first-row uniqueness conflicts fail closed without automatic retry. There is no permanent receipt after removal.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: NPC created, or companion projection created or reused with current combat state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          description: Missing or unsupported creation/projection fields
        "403":
          description: Missing live host/member proof or foreign companion battle
        "404":
          description: Party not found or expired
        "409":
          description: Runtime revision, serialization, first-row uniqueness or retained-companion conflict; explicitly retry after reviewing current state
  /party/{code}/combat-npcs/{npcId}/recover-companion:
    post:
      operationId: recoverPartyCompanion
      tags: [party]
      summary: Restore a retained companion to an explicitly selected enrolled member
      description: Original host proof is revalidated with target enrollment in one serializable runtime transaction. Requires the reviewed runtime revision and exact detachedAt stamp. Preserves live data, records reason and previous binding, and leaves the companion outside encounters. Duplicate target bindings and stale or repeated requests conflict; no automatic retry or canonical source ownership verification.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
        - name: npcId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetMemberId, expectedRevision, expectedDetachedAt, reason]
              properties:
                targetMemberId:
                  type: string
                  minLength: 1
                  maxLength: 128
                expectedRevision:
                  type: integer
                  minimum: 1
                expectedDetachedAt:
                  type: string
                  minLength: 1
                  maxLength: 64
                reason:
                  type: string
                  minLength: 3
                  maxLength: 240
      responses:
        "200":
          description: Ownership restored after transaction commit; NPC includes updated companionAdmission and recoveredFrom metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          description: Invalid review data or target enrollment
        "403":
          description: Missing or revoked original host proof
        "404":
          description: Party absent or expired
        "409":
          description: Stale revision, detachment mismatch or duplicate binding; refresh and review
        "500":
          description: Recovery failed without success acknowledgement
  /party/{code}/combat-npcs/{npcId}/dummy-state:
    put:
      operationId: updateCombatNpcDummyState
      tags: [party]
      summary: Update NPC health and action state as original host
      description: Requires persisted original-host proof before session or instance work. Companion ownership metadata and member proof do not grant manual instance control. NPC creation and player companion ownership remain separate.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
        - name: npcId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Instance action accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          description: Invalid action input
        "403":
          description: Missing original-host proof
        "404":
          description: Party or party-local NPC instance not found
        "409":
          description: Runtime revision conflict
  /party/{code}/combat-npcs/{npcId}/gear:
    put:
      operationId: updateCombatNpcGear
      tags: [party]
      summary: Replace NPC gear as original host
      description: Requires persisted original-host proof before session or instance work. Companion ownership metadata and member proof do not grant manual instance control. NPC creation and player companion ownership remain separate.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
        - name: npcId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Instance action accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          description: Invalid action input
        "403":
          description: Missing original-host proof
        "404":
          description: Party or party-local NPC instance not found
        "409":
          description: Runtime revision conflict
  /party/{code}/combat-npcs/{npcId}/visible-stats:
    put:
      operationId: updateCombatNpcVisibleStats
      tags: [party]
      summary: Set NPC stat visibility as original host
      description: Requires persisted original-host proof before session or instance work. Companion ownership metadata and member proof do not grant manual instance control. NPC creation and player companion ownership remain separate.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
        - name: npcId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Instance action accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          description: Invalid action input
        "403":
          description: Missing original-host proof
        "404":
          description: Party or party-local NPC instance not found
        "409":
          description: Runtime revision conflict
  /party/{code}/combat-npcs/{npcId}:
    delete:
      operationId: removeCombatNpc
      tags: [party]
      summary: Remove NPC instance as original host
      description: Requires persisted original-host proof before session or instance work. Companion ownership metadata and member proof do not grant manual instance control. NPC creation and player companion ownership remain separate.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
        - name: npcId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Instance action accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          description: Invalid action input
        "403":
          description: Missing original-host proof
        "404":
          description: Party or party-local NPC instance not found
        "409":
          description: Runtime revision conflict
  /party/{code}/combat-npcs/{npcId}/initiative:
    put:
      operationId: rollNpcInitiative
      tags: [party]
      summary: Set NPC initiative as original host
      description: Requires persisted original-host proof before session or instance work. Companion ownership metadata and member proof do not grant manual instance control. NPC creation and player companion ownership remain separate.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
        - name: npcId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Instance action accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          description: Invalid action input
        "403":
          description: Missing original-host proof
        "404":
          description: Party or party-local NPC instance not found
        "409":
          description: Runtime revision conflict
  /party/{code}/combat/apply-outcomes:
    post:
      operationId: applyRemoteCombatOutcomes
      tags: [party]
      summary: Apply bounded remote-authoritative combat outcomes
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "400":
          description: Missing or unsupported action input
        "403":
          description: Missing live caller proof or action not permitted for caller
        "404":
          description: Party not found
        "200":
          description: Outcomes applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "409":
          description: Guard conflict (turn/authority/source mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /party/{code}/events:
    post:
      operationId: postPartyEvent
      tags: [party]
      summary: Append a party event
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "400":
          description: Missing or unsupported action input
        "403":
          description: Missing live caller proof or action not permitted for caller
        "404":
          description: Party not found
        "200":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /party/{code}/roll-requests:
    post:
      operationId: createRollRequest
      tags: [party]
      summary: Create a party roll request as the original host
      description: Requires persisted original-host proof before activity, expiry cleanup or runtime work. Member proof, watched codes and DM or AI DM labels do not grant prompt-authoring authority.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "403":
          description: Missing or invalid host capability (party_host_required)
        "404":
          description: Party session expired or not found
        "400":
          description: Missing prompt inputs or no live target members
        "200":
          description: Roll request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /party/{code}/roll-requests/{requestId}/respond:
    put:
      security:
        - partyCapability: []
      operationId: respondRollRequest
      tags: [party]
      summary: Respond to a roll request
      parameters:
        - $ref: "#/components/parameters/PartyCode"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "403":
          description: Missing member proof or request not owned by this recipient
        "200":
          description: Roll response accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /party/{code}/rest-requests:
    post:
      security:
        - partyCapability: []
      operationId: createRestRequest
      tags: [party]
      summary: Create a rest request
      parameters:
        - $ref: "#/components/parameters/PartyCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "403":
          description: Missing member proof or request not owned by this recipient
        "200":
          description: Rest request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /party/{code}/rest-requests/{requestId}:
    put:
      operationId: respondRestRequest
      tags: [party]
      summary: Approve or deny a rest request as the original party host
      description: Requires persisted host bearer proof. resolvedBy is ignored; the server stamps dm. Legacy unclaimed parties fail closed.
      security:
        - partyCapability: []
      parameters:
        - $ref: "#/components/parameters/PartyCode"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "403":
          description: Missing or invalid original-host proof (party_host_required)
        "404":
          description: Party session or rest request not found
        "200":
          description: Rest response accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /party/{code}/rest-requests/{requestId}/ack:
    put:
      security:
        - partyCapability: []
      operationId: acknowledgeRestRequest
      tags: [party]
      summary: Acknowledge a completed rest request
      parameters:
        - $ref: "#/components/parameters/PartyCode"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "403":
          description: Missing member proof or request not owned by this recipient
        "200":
          description: Rest acknowledgment accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /ai/parse-update:
    post:
      operationId: parseUpdate
      tags: [ai]
      summary: Parse free-text updates into structured character/quest deltas
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Parsed update payload
          headers:
            X-Idempotency-Replay:
              $ref: "#/components/headers/IdempotencyReplay"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "409":
          description: Idempotency conflict or in-progress response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /ai/analyze-loot:
    post:
      operationId: analyzeLootImage
      tags: [ai]
      summary: Analyze loot from an image upload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                snarkyParseMode:
                  oneOf:
                    - type: boolean
                    - type: string
                    - type: number
              required:
                - image
      responses:
        "200":
          description: Loot analysis payload
          headers:
            X-Idempotency-Replay:
              $ref: "#/components/headers/IdempotencyReplay"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "409":
          description: Idempotency conflict or in-progress response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /ai/parse-quest-update:
    post:
      operationId: parseQuestUpdate
      tags: [ai]
      summary: Parse world journal text into quest and lore updates
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Quest update payload
          headers:
            X-Idempotency-Replay:
              $ref: "#/components/headers/IdempotencyReplay"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "409":
          description: Idempotency conflict or in-progress response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /ai/repair-import:
    post:
      operationId: repairImport
      tags: [ai]
      summary: Attempt to repair malformed import payload into a character snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rawText:
                  type: string
              required:
                - rawText
      responses:
        "200":
          description: Repaired snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /ai/level-up:
    post:
      operationId: getLevelUpData
      tags: [ai]
      summary: Generate level-up recommendations and derived progression metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Level-up payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
components:
  securitySchemes:
    partyCapability:
      type: http
      scheme: bearer
      description: Server-issued private host or member capability, as required by each route
  parameters:
    PartyCode:
      name: code
      in: path
      required: true
      schema:
        type: string
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Optional idempotency key for replay-safe AI calls
  headers:
    IdempotencyReplay:
      description: Present and true when response body is a replayed idempotent result
      schema:
        type: string
        enum: ["true"]
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

