name: Adventure workspace browser acceptance
on:
  pull_request:
    paths:
      - "artifacts/living-character-sheet/**"
      - ".github/workflows/adventure-workspace-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adventure-workspace-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dnd_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dnd_browser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dnd_browser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.20.2
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir artifacts/living-character-sheet exec playwright install --with-deps chromium
      - name: Prepare local browser-test environment
        run: touch .env
      - name: Prepare browser-test database schema
        run: pnpm --filter @workspace/db push
      - name: Browser workspace acceptance
        run: cd artifacts/living-character-sheet && pnpm exec playwright test -c playwright.smoke.config.ts workspace-customization.smoke.spec.ts
      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-playwright-evidence
          path: |
            artifacts/living-character-sheet/test-results/
            artifacts/living-character-sheet/playwright-report/
          if-no-files-found: ignore
