name: Adventure workspace browser acceptance
on:
  pull_request:
    paths:
      - "artifacts/living-character-sheet/**"
      - ".github/workflows/adventure-workspace-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adventure-workspace-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.20.2
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir artifacts/living-character-sheet exec playwright install --with-deps chromium
      - name: Browser workspace acceptance
        run: pnpm --dir artifacts/living-character-sheet run test:smoke:adventure -- --grep "customize, save, focus and restore personal workspace"
      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-playwright-evidence
          path: |
            artifacts/living-character-sheet/test-results/
            artifacts/living-character-sheet/playwright-report/
          if-no-files-found: ignore
